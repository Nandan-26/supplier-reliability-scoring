name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -v
      - name: Validate a fresh full-size dataset in an isolated temporary directory
        run: python scripts/validate_full_dataset.py
      - name: Verify full-scale reproducibility with table and artifact SHA-256 checksums
        run: python scripts/check_reproducibility.py --output $RUNNER_TEMP/reproducibility_report.json
      - name: Evaluate risk classification on an independent full-scale seed
        run: python scripts/evaluate_holdout.py
