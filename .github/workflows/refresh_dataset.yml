name: Refresh generated supplier artifacts

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/schema.sql"
      - "scripts/refresh_dataset.py"
      - "scripts/evaluate_ground_truth.py"
      - "scripts/evaluate_holdout.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: supplier-dataset-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[data-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate a fresh validated dataset without historical snapshots
        run: python scripts/refresh_dataset.py

      - name: Commit refreshed reproducible artifacts (database is regenerated locally)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          # SQLite is reproducibly generated by the workflow and intentionally not committed.
          git rm --cached --ignore-unmatch data/supplier_scoring.db
          if git diff --cached --quiet; then
            echo "No dataset artifact changes to commit."
          else
            git commit -m "[data-refresh] Publish validated supplier exports and evaluation artifacts"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
